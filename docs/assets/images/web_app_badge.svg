<svg width="161" height="44" viewBox="0 0 161 44" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Badge Background -->
  <rect x="0.5" y="0.5" width="160" height="43" rx="4" fill="#000000" stroke="#a2a2a1" stroke-width="0.75"/>
  <!-- Modern Browser / Web Icon -->
  <g transform="translate(13, 11)">
    <!-- Globe outer circle -->
    <circle cx="11" cy="11" r="10.5" stroke="#D2B45F" stroke-width="1.4" fill="#121815"/>
    <!-- Globe vertical meridian -->
    <ellipse cx="11" cy="11" rx="4.6" ry="10.5" stroke="#D2B45F" stroke-width="1.1" fill="none"/>
    <!-- Globe equator -->
    <line x1="0.5" y1="11" x2="21.5" y2="11" stroke="#D2B45F" stroke-width="1.1"/>
    <!-- Latitude lines -->
    <line x1="2.8" y1="6.3" x2="19.2" y2="6.3" stroke="#D2B45F" stroke-width="0.9" stroke-opacity="0.8"/>
    <line x1="2.8" y1="15.7" x2="19.2" y2="15.7" stroke="#D2B45F" stroke-width="0.9" stroke-opacity="0.8"/>
  </g>
  <!-- Text: Small Kicker -->
  <text x="43" y="16.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="600" fill="#A7B5AF" letter-spacing="0.5px">OPEN IN BROWSER</text>
  <!-- Text: Title -->
  <text x="43" y="32.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Web App</text>
</svg>
